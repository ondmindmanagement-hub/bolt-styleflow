<!doctype html><meta charset="utf-8"><title>BOLT StyleFlow</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:760px;margin:64px auto;padding:0 24px}button{padding:12px 18px;margin:6px}pre{background:#f4f4f4;padding:16px;border-radius:12px;white-space:pre-wrap}</style><h1>BOLT StyleFlow</h1><p>Governed workflow scaffold for beauty and e-commerce AI experiences.</p><button onclick="run('analyze')">Analyze request</button><button onclick="run('recommend')">Request recommendation</button><button onclick="run('purchase')">Attempt purchase</button><pre id="out"></pre><script>function run(type){const decision=type==='purchase'?'approval_required':'allow';document.getElementById('out').textContent=JSON.stringify({step:type,decision,trace_id:'demo-'+Date.now(),note:'YouCam API integration is the next hackathon implementation step.'},null,2)}</script>
